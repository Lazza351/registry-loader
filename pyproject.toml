[project]
name = "nexus-auto-uploader"
version = "0.1.0"
description = "Polling uploader for Nexus Docker and PyPI hosted repositories"
requires-python = ">=3.11,<3.15"
dependencies = ["twine>=6.2,<7", "requests>=2.32.4,<3"]

[project.scripts]
nexus-auto-uploader = "nexus_uploader.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_uploader"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
