name: Ошибка
description: Сообщить о воспроизводимой ошибке
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Не публикуйте секреты или уязвимости. Для уязвимостей следуйте SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: Версия/коммит, ОС, Python или Docker/Compose, версия Nexus; без credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести
      description: Минимальные шаги и обезличенная конфигурация.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый и фактический результат
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Обезличенные логи / result.json
      description: Удалите токены, пароли, приватные адреса и данные.
      render: text
